<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iAimBxt_</title>
<link id="fav" rel="icon" href="img/logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#121210;--card:#1a1a17;--line:#2e2e29;--y:#ffd60a;--t:#f2f0e6;--m:#8f8d82;--g1:#ffe98a;--g2:#ff9f1c}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--t);line-height:1.65;overflow-x:hidden}
a{color:inherit;text-decoration:none}
::selection{background:var(--y);color:#111}
.ambient{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(600px 400px at 85% 10%,color-mix(in srgb,var(--y) 8%,transparent),transparent),radial-gradient(500px 400px at 5% 80%,color-mix(in srgb,var(--y) 5%,transparent),transparent)}
.ambient:before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;opacity:.18}
.loader{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:opacity .6s,visibility .6s}
.loader.off{opacity:0;visibility:hidden}
.loader img{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--y)}
.loader h1{font-family:Sora;font-size:34px;letter-spacing:.2em;color:var(--y)}
.loader p{font-family:'JetBrains Mono';font-size:12px;color:var(--m);letter-spacing:.2em}
.loader hr{width:50px;border:0;border-top:2px solid var(--y);margin:6px 0}
nav{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:12px 5vw;background:rgba(18,18,16,.92);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:'JetBrains Mono';font-weight:700}
.brand img{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid var(--y)}
nav ul{display:flex;gap:4px;list-style:none}
nav ul a{padding:6px 12px;font-size:14px;color:var(--m);border-radius:9px;transition:.2s}
nav ul a:hover{color:#111;background:var(--y)}
.dc{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:12px;background:var(--y);color:#111;font-weight:600;font-size:14px}
.tg{display:none;background:none;border:0;cursor:pointer;flex-direction:column;gap:5px}
.tg span{width:22px;height:2px;background:var(--y)}
section{padding:84px 5vw;max-width:1120px;margin:auto}
.eyebrow{font-family:'JetBrains Mono';color:var(--y);font-size:14px;margin-bottom:6px}
h2{font-family:Sora;font-weight:700;font-size:clamp(26px,4.5vw,42px);line-height:1.15;margin-bottom:34px}
h2:after{content:"";display:block;width:56px;height:4px;margin-top:10px;background:var(--y);border-radius:2px}
.hero{min-height:88vh;display:flex;align-items:center}
.hero__c{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center;width:100%}
.hero h1{font-family:Sora;font-weight:800;font-size:clamp(40px,8vw,84px);line-height:1}
.hero h1 span{color:var(--y)}
.role{font-family:'JetBrains Mono';color:var(--y);font-size:clamp(15px,2.2vw,20px);margin:16px 0;min-height:1.6em}
.hero p.d{color:#a9a79a;max-width:520px;font-family:'JetBrains Mono';font-size:14.5px;line-height:1.8}
.acts{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:28px}
.btn{font-weight:600;padding:12px 22px;font-size:15px;border:2px solid var(--y);border-radius:12px;background:none;color:var(--t);cursor:pointer;box-shadow:4px 4px 0 var(--line);transition:.15s}
.btn.p{background:var(--y);color:#111;box-shadow:4px 4px 0 color-mix(in srgb,var(--y) 40%,#000)}
.btn:hover{transform:translate(-2px,-2px)}
.soc{display:flex;gap:10px}
.soc a{width:42px;height:42px;display:grid;place-items:center;border:2px solid var(--line);border-radius:12px;color:var(--m);transition:.2s}
.soc a:hover{color:#111;background:var(--y);border-color:var(--y)}
.ph{position:relative;justify-self:center;width:min(320px,80%)}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;border:3px solid var(--y);position:relative;z-index:1}
.ph:before{content:"";position:absolute;inset:-14px;border:2px dashed var(--line);border-radius:50%;animation:spin 30s linear infinite}
.ph:after{content:"";position:absolute;inset:10%;background:var(--y);filter:blur(70px);opacity:.18}
@keyframes spin{to{transform:rotate(360deg)}}
.srv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.s{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;aspect-ratio:1;gap:6px;transition:.2s}
.s:hover{transform:translateY(-4px);border-color:var(--y)}
.im{width:62px;height:62px;border-radius:12px;background:#0c0c0b;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:26px;color:var(--y);overflow:hidden;margin-bottom:6px;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.im img{width:100%;height:100%;object-fit:cover}
.s:hover .im{transform:scale(1.12) rotate(-5deg)}
.s h4{font-family:Sora;font-size:15px;overflow-wrap:anywhere}
.rk{font-size:12.5px;color:var(--m)}.rk.own{color:var(--y)}
.sk{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px}
.sc{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:24px 16px;text-align:center;transition:.2s}
.sc:hover{border-color:var(--y);transform:translate(-3px,-3px);box-shadow:5px 5px 0 var(--y)}
.ci{width:104px;height:104px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:conic-gradient(var(--y) calc(var(--p)*1%),var(--line) 0)}
.ci b{width:84px;height:84px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:Sora;font-size:20px}
.sc h3{font-size:14.5px;font-weight:600}
.quote{margin-top:36px;padding:22px 26px;border-left:6px solid var(--y);background:var(--card);border-radius:6px 18px 18px 6px;color:#d4d2c6}
.rev{columns:2 300px;column-gap:20px}
.r{break-inside:avoid;margin-bottom:20px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:22px;transition:.25s}
.r:hover{transform:translate(-3px,-3px);border-color:var(--y);box-shadow:5px 5px 0 var(--y)}
.r p{font-size:15px;color:#d4d2c6;margin-bottom:16px}
.who{display:flex;align-items:center;gap:12px;border-top:2px solid var(--line);padding-top:14px}
.who .im{width:46px;height:46px;font-size:20px;margin:0}
.who b{display:block;font-size:15px;line-height:1.2}.who span{font-size:12.5px;color:var(--m)}
.works{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.works figure{background:var(--card);border:2px solid var(--line);border-radius:18px;overflow:hidden}
.works img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.works figcaption{padding:12px 16px;font-size:14px;color:var(--m)}
.hint{color:var(--m);margin:-24px 0 30px}
.ct{text-align:center}
.ct .ic{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;background:var(--y);color:#111;display:grid;place-items:center}
.ct h2{margin-bottom:12px}.ct h2:after{margin:10px auto 0}
.ct p{color:var(--m);max-width:480px;margin:0 auto 28px}
.dcb{display:inline-flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px 26px;text-align:left;transition:.2s}
.dcb:hover{border-color:var(--y);box-shadow:5px 5px 0 var(--y);transform:translate(-3px,-3px)}
.dcb b{display:block}.dcb span{font-size:13px;color:var(--m)}
footer{padding:36px 5vw;border-top:2px solid var(--line);color:var(--m);font-size:13px;text-align:center}
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}
.rv.in{opacity:1;transform:none}
@media(max-width:820px){
.hero__c{grid-template-columns:1fr;text-align:center}.hero .ph{order:-1;width:200px}.hero p.d{margin:auto}.acts{justify-content:center}
.tg{display:flex}.dc{display:none}
nav ul{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:var(--bg);padding:12px 5vw;border-bottom:2px solid var(--line)}
nav ul.open{display:flex}section{padding:56px 5vw}}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.tags span{padding:2px 9px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;color:var(--m);transition:.2s}
.tags span:first-child{color:var(--y);border-color:var(--y)}
.tags span:hover{background:var(--y);color:#111;border-color:var(--y)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.c{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:24px;transition:.2s}
.c:hover{transform:translate(-3px,-3px);border-color:var(--y);box-shadow:5px 5px 0 var(--y)}
.c h3{font-family:Sora;font-size:20px;margin-bottom:6px}.c p{color:var(--m);font-size:14.5px}
.c.plug{border-left:6px solid var(--y);border-radius:6px 18px 18px 6px}
.c code{display:block;margin-top:10px;font-family:'JetBrains Mono';font-size:13px;color:var(--y);word-break:break-all}
.c .btn{display:inline-block;margin-top:14px;text-align:center}
.stats{display:flex;gap:44px;margin-top:40px;flex-wrap:wrap;border-top:2px solid var(--line);padding-top:20px}
.stats b{display:block;font-family:Sora;font-size:34px;line-height:1.1}.stats span{font-size:13px;color:var(--m)}
.stk{display:inline-block;background:var(--y);color:#111;font-weight:700;font-size:13px;padding:4px 12px;border-radius:10px;margin-bottom:14px;transform:rotate(-3deg);box-shadow:3px 3px 0 #000}
.hi{font-family:'JetBrains Mono';color:var(--t);font-size:clamp(18px,2.6vw,24px);display:block;margin-bottom:4px}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--y);z-index:30}
.r p.cl{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:10px}
.more{background:none;border:0;color:var(--y);font:600 13px Inter;cursor:pointer;margin-bottom:14px;padding:0}
.more:hover{text-decoration:underline}
.works{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.works figure{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:8px;cursor:zoom-in;transition:.2s;min-width:0}
.works figure:hover{border-color:var(--y);transform:translate(-3px,-3px);box-shadow:5px 5px 0 var(--y)}
.works img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;border-radius:12px}
.works figcaption{padding:10px 6px 4px;font:500 13px 'JetBrains Mono',monospace;color:var(--t);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wmore{background:none;border:2px dashed var(--y);border-radius:18px;padding:8px;cursor:pointer;color:var(--y);font:600 14px Inter;display:flex;flex-direction:column;gap:12px;align-items:stretch;transition:.2s}
.wmore:hover{background:rgba(255,214,10,.07);transform:translate(-3px,-3px)}
.wmore .pl{flex:1;min-height:100px;background:var(--card);border-radius:12px;display:grid;place-items:center}
.wmore .pl i{width:46px;height:46px;border:2px solid var(--y);border-radius:50%;display:grid;place-items:center;font:400 26px Inter}
.wbox{max-width:1100px;max-height:88vh;overflow:auto;padding:28px}
.wbox h3{padding-bottom:14px;margin-bottom:18px;border-bottom:2px solid var(--line)}
.wbox .works{margin-top:0}.wbox .works p{margin:0}
.lbd{max-width:760px;text-align:center;color:#d4d2c6;font-size:14px}
#lbC{color:var(--t);font-weight:600}
.c.dl{display:block;color:inherit;text-decoration:none;cursor:pointer}
.dlb{display:inline-block;margin-top:14px;font:600 13px Inter;color:#111;background:var(--y);padding:6px 12px;border-radius:10px}
.modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;transition:.25s}
.modal.on{opacity:1;visibility:visible}
.mbox{position:relative;max-width:560px;width:100%;background:var(--card);border:2px solid var(--y);border-radius:18px;padding:30px;box-shadow:6px 6px 0 var(--y)}
.mbox h3{font-family:Sora;font-size:22px}.mbox small{color:var(--m)}.mbox p{margin-top:16px;color:#d4d2c6}
.x{position:absolute;top:12px;right:16px;background:none;border:0;color:var(--t);font-size:28px;cursor:pointer}
.x:hover{color:var(--y)}
#lb{flex-direction:column;gap:12px;background:rgba(0,0,0,.92)}
#lb img{max-width:92vw;max-height:78vh;border-radius:14px;border:2px solid var(--line)}
#lb .info{display:flex;gap:16px;color:var(--m);font-size:14px}
.ar{position:absolute;top:50%;transform:translateY(-50%);background:var(--card);border:2px solid var(--line);color:var(--t);width:44px;height:44px;border-radius:12px;font-size:24px;cursor:pointer}
.ar:hover{background:var(--y);color:#111}.ar.l{left:16px}.ar.rr{right:16px}
body.lock{overflow:hidden}
.loader .wl{color:var(--t);font-size:14px;animation:pulse 1.2s ease-in-out infinite}
.lbar{width:180px;height:4px;background:var(--line);border-radius:2px;margin-top:14px;overflow:hidden}
.lbar i{display:block;height:100%;width:0;background:var(--y);animation:fill 2.4s cubic-bezier(.4,0,.2,1) forwards}
@keyframes fill{to{width:100%}}
@keyframes pulse{50%{opacity:.35}}
.loader img{animation:pop .8s cubic-bezier(.3,1.5,.5,1) backwards}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
.stk{animation:stkIn .8s cubic-bezier(.3,1.5,.5,1) 2.6s backwards,float 3s ease-in-out 3.4s infinite!important;will-change:transform}
@keyframes stkIn{from{opacity:0;transform:scale(.3) rotate(-25deg)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg);box-shadow:3px 3px 0 #000}50%{transform:translateY(-14px) rotate(3deg);box-shadow:3px 20px 16px -8px rgba(0,0,0,.7)}}
.stats{position:relative;border-top-color:transparent}
.stats:before{content:"";position:absolute;top:-2px;left:0;height:2px;width:0;background:var(--y);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.stats.go:before{width:100%}
.stats>div{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s,filter .3s;cursor:default}
.stats.go>div{opacity:1;transform:none}
.stats.go>div:nth-child(2){transition-delay:.15s}.stats.go>div:nth-child(3){transition-delay:.3s}
.stats.go>div:hover{transform:translateY(-6px)}
.stats b{transition:color .3s,text-shadow .3s}
.stats>div:hover b{color:var(--y);text-shadow:0 0 22px color-mix(in srgb,var(--y) 55%,transparent)}
.stats b.done{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{50%{transform:scale(1.18);color:var(--y)}}
/* ===== degradados ===== */
.gt,.hero h1 span,.loader h1,h2,.stats b,.c h3,.role{background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.hero h1 span,.loader h1{background-image:linear-gradient(110deg,var(--g1) 0%,var(--y) 30%,var(--g2) 55%,var(--y) 75%,var(--g1) 100%);background-size:220% auto;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-220% center}}
h2{background-image:linear-gradient(100deg,#f2f0e6 10%,var(--y) 70%,var(--g2) 100%);padding-bottom:2px}
h2:after{background:linear-gradient(90deg,var(--y),var(--g2))!important;-webkit-text-fill-color:initial}
.stats b{background-image:linear-gradient(180deg,var(--g1) 0%,var(--y) 60%,var(--g2) 100%)}
.stats>div:hover b{text-shadow:none;filter:drop-shadow(0 0 14px color-mix(in srgb,var(--y) 60%,transparent))}
.c h3{background-image:linear-gradient(100deg,#f2f0e6,var(--y));display:inline-block}
.role{background-image:linear-gradient(90deg,var(--y),var(--g2) 60%,var(--g1));display:inline-block}
.ci b{-webkit-text-fill-color:initial}
.loader h1{display:inline-block}
/* ===== lista de servidores deslizante ===== */
.mq{overflow:hidden;padding:18px 0 26px;margin:0 -5vw;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mq__track{display:flex;width:max-content;animation:mq 90s linear infinite}
.mq__track.paused{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.sv{flex:none;width:200px;margin-right:18px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:22px 14px 18px;text-align:center;transition:border-color .25s,box-shadow .25s,transform .25s}
.sv:hover{border-color:var(--y);box-shadow:0 0 0 1px var(--y),0 10px 30px -8px color-mix(in srgb,var(--y) 30%,transparent);transform:translateY(-6px)}
.sv .im{width:112px;height:112px;margin:0 auto 14px;background:transparent;border:0;font-size:30px}
.sv .im img{object-fit:contain}
.sv h4{font-family:Sora;font-size:16px;font-weight:700;overflow-wrap:anywhere}
.sv .rk{display:block;font:500 12px 'JetBrains Mono';margin-top:2px}
.mq__ctl{text-align:center}
#mqBtn{display:inline-flex;align-items:center;gap:10px;cursor:pointer}
#mqBtn svg{width:14px;height:14px}
.adm{display:none}.adm.on{display:block}.adm a{color:var(--y)!important;border:1px solid var(--y);border-radius:9px}
.sv{position:relative}
.bd{position:absolute;top:10px;right:10px;font:700 10px 'JetBrains Mono',monospace;letter-spacing:.08em;padding:3px 10px;border-radius:999px;border:1px solid}
.bd.on{color:#3ddc84;background:rgba(61,220,132,.12);border-color:rgba(61,220,132,.55)}
.bd.off{color:#ff6b6b;background:rgba(255,107,107,.1);border-color:rgba(255,107,107,.45)}
.sv.act{border-color:rgba(61,220,132,.35)}
.sv.act:hover{border-color:#3ddc84;box-shadow:0 0 0 1px #3ddc84,0 10px 30px -8px rgba(61,220,132,.35)}
</style>
</head>

  <p class="d" id="hDesc"></p>
  <div class="acts"><a href="#servidores" class="btn p" id="hB1"></a><a href="#contacto" class="btn" id="hB2"></a>
   <div class="soc"><a id="hDc" target="_blank" rel="noopener" title="Discord" aria-label="Discord"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.893.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg></a><a id="hNm" target="_blank" rel="noopener" title="NameMC" aria-label="NameMC"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M0 0v24h24V0Zm4.8 4.8H16V8h3.2v11.2H16V8H8v11.2H4.8V8Z"/></svg></a></div></div>
  <div class="stats" id="stats"></div>
</div><div class="ph"><img id="hPh" alt=""></div></div></section>
<section id="plugins"><div id="h_plugins"></div><div class="g" id="plg"></div></section>
<section id="servidores"><div id="h_servers"></div>
  <div class="mq"><div class="mq__track" id="srv"></div></div>
  <div class="mq__ctl"><button class="btn" id="mqBtn" aria-pressed="false"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/></svg><span>Parar lista de servidores</span></button></div></section>
<section id="habilidades"><div id="h_skills"></div><div class="g" id="skl"></div></section>
<section id="referencias"><div id="h_reviews"></div><div class="rev" id="rev"></div></section>
<section id="trabajos"><div id="h_works"></div><div class="works" id="works"></div></section>
<section id="contacto"><div id="h_contact"></div><div class="g" id="ctc"></div></section>
</main>
<footer id="ft"></footer>
<div id="rm" class="modal"><div class="mbox"><button class="x" data-close>×</button><h3 id="rmA"></h3><small id="rmR"></small><p id="rmQ"></p></div></div>
<div id="wm" class="modal"><div class="mbox wbox"><button class="x" data-close>×</button><h3>Todos mis trabajos</h3><div class="works" id="wAll"></div></div></div>
<div id="lb" class="modal"><button class="x" data-close>×</button><button class="ar l" id="lbP" aria-label="Anterior">‹</button><img id="lbI" alt=""><div class="info"><span id="lbC"></span><span id="lbN"></span></div><p id="lbD" class="lbd"></p><button class="ar rr" id="lbX" aria-label="Siguiente">›</button></div>
<script src="data.js"></script>
<script>
const PREVIEW=/[?&]preview/.test(location.search)&&window.parent!==window;
let SITE=window.SITE,statsDone=PREVIEW,BL={};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S=p=>BL[p]||p;
const fig=(w,i,rv)=>`<figure class="${rv?"rv":""}" data-i="${i}"><img src="${esc(S(w[0]))}" alt="${esc(w[1])}" loading="lazy"><figcaption>${esc(w[1])}</figcaption></figure>`;
const url=u=>/^(https?:|mailto:|#)/.test(u)?esc(u):"#";
const own=r=>r==="Dueño"||r==="Owner";
const img=(f,n)=>`<span class="im"><img src="img/${esc(f)}" alt="" data-n="${esc(n)}" onerror="this.parentNode.textContent=this.dataset.n.charAt(0)"></span>`;
const head=k=>{const h=SITE.sec[k];return `<p class="eyebrow rv">${esc(h[0])}</p><h2 class="rv">${esc(h[1])}</h2>${h[2]?`<p class="hint">${esc(h[2])}</p>`:""}`};
const card=s=>{const a=s[3]==="actual";return `<div class="sv ${a?"act":""}"><span class="bd ${a?"on":"off"}">${a?"ACTUAL":"RESIGN"}</span>${img(s[2],s[0])}<h4>${esc(s[0])}</h4><span class="rk ${own(s[1])?"own":""}">${esc(s[1])}</span></div>`};
const io=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.1});
function render(){
 const D=SITE,T=D.theme||{},rs=document.documentElement.style,M={bg:"--bg",card:"--card",line:"--line",text:"--t",muted:"--m",accent:"--y",g1:"--g1",g2:"--g2"};
 for(const k in M)if(T[k])rs.setProperty(M[k],T[k]);
 document.title=D.title;$("fav").href=D.logo;
 $("ldImg").src=$("nvImg").src=D.logo;$("hPh").src=D.hero.photo||D.logo;
 $("ldName").textContent=D.brand;$("ldRole").textContent=D.loader.role;$("ldWl").textContent=D.loader.welcome;
 const b=D.brand;$("nvName").innerHTML=b.endsWith("_")?esc(b.slice(0,-1))+'<b style="color:var(--y)">_</b>':esc(b);
 const H=D.hero;$("hSt").textContent=H.sticker;$("hSt").style.display=H.sticker?"":"none";$("hHi").textContent=H.hi;$("hName").textContent=H.name;$("hDesc").textContent=H.desc;$("hB1").textContent=H.btn1;$("hB2").textContent=H.btn2;
 $("hDc").href=$("nvDc").href=url(D.links.discord);$("hNm").href=url(D.links.namemc);
 $("stats").innerHTML=D.stats.map(s=>`<div><b data-n="${+s[0]||0}" data-s="${esc(s[1])}">${statsDone?(+s[0]||0)+esc(s[1]):0}</b><span>${esc(s[2])}</span></div>`).join("");
 if(PREVIEW)$("stats").classList.add("go");
 for(const k of ["plugins","servers","skills","reviews","works","contact"])$("h_"+k).innerHTML=head(k);
 $("plg").innerHTML=D.plugins.map(p=>{const j=/^plugins\/[A-Za-z0-9_-][A-Za-z0-9._-]*\.jar$/.test(p[2]||"")?p[2]:"",t=`<h3>${esc(p[0])}</h3><p>${esc(p[1])}</p>${j?'<span class="dlb">⬇ Clic para descargar</span>':""}`;return j?`<a class="c plug dl rv" href="${esc(j)}" download>${t}</a>`:`<div class="c plug rv">${t}</div>`}).join("");
 const sv=D.servers.map(card).join("");$("srv").innerHTML=sv+sv;$("srv").style.animationDuration=(+D.speed||90)+"s";
 $("skl").innerHTML=D.skills.map(s=>`<div class="c rv"><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p><div class="tags">${String(s[2]).split(",").map(x=>x.trim()).filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join("")}</div></div>`).join("");
 $("rev").innerHTML=D.reviews.map((r,i)=>`<div class="r rv" style="transition-delay:${(i%3)*.12}s"><p class="cl">“${esc(r[4])}”</p>${r[4].length>140?`<button class="more" data-i="${i}">Ver más</button>`:""}<div class="who">${img(r[3],r[1])}<div><b>${esc(r[1])}</b><span>${esc(r[2])} · ${esc(r[0])}</span></div></div></div>`).join("");
 $("works").innerHTML=D.works.length?D.works.slice(0,3).map((w,i)=>fig(w,i,1)).join("")+(D.works.length>3?'<button type="button" class="wmore rv" id="wMore"><span class="pl"><i>+</i></span><span>Ver más</span></button>':""):'<p class="hint" style="margin:0">Próximamente...</p>';
 $("ctc").innerHTML=D.contact.map(c=>`<div class="c rv"><h3>${esc(c[0])}</h3><p>${esc(c[1])}</p><code>${esc(c[2])}</code>${c[4]?`<a class="btn" href="${url(c[4])}" target="_blank" rel="noopener">${esc(c[3])}</a>`:`<button class="btn p" data-copy="${esc(c[2])}">${esc(c[3])}</button>`}</div>`).join("");
 $("ft").textContent=D.footer;
 document.querySelectorAll(".rv:not(.in)").forEach(el=>PREVIEW?el.classList.add("in"):io.observe(el));
}
render();
try{if(localStorage.iaimbxt_admin==="1")document.querySelector(".adm").classList.add("on")}catch(e){}
/* servidores: pausa */
{const tr=$("srv"),b=$("mqBtn"),L=b.querySelector("span"),I=b.querySelector("svg");
const PA='<rect x="5" y="4" width="5" height="16" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/>',PL='<path d="M7 4l13 8-13 8z"/>';
b.onclick=()=>{const p=tr.classList.toggle("paused");b.setAttribute("aria-pressed",p);L.textContent=p?"Reanudar lista de servidores":"Parar lista de servidores";I.innerHTML=p?PL:PA}}
/* reseñas / galería */
const rm=$("rm"),lb=$("lb");let cur=0;
$("rev").onclick=e=>{const b=e.target.closest(".more");if(!b)return;const r=SITE.reviews[+b.dataset.i];$("rmA").textContent=r[1];$("rmR").textContent=r[2]+" · "+r[0];$("rmQ").textContent="“"+r[4]+"”";rm.classList.add("on")};
const W=()=>SITE.works;
function show(i){cur=(i+W().length)%W().length;const w=W()[cur];$("lbI").src=S(w[0]);$("lbC").textContent=w[1]||"";$("lbD").textContent=w[2]||"";$("lbN").textContent=(cur+1)+" / "+W().length}
const openLb=e=>{const f=e.target.closest("figure");if(!f)return;show(+f.dataset.i);lb.classList.add("on")};
$("works").onclick=e=>{if(e.target.closest("#wMore")){$("wAll").innerHTML=W().map((w,i)=>fig(w,i,0)).join("");$("wm").classList.add("on");return}openLb(e)};
$("wAll").onclick=openLb;
$("lbP").onclick=()=>show(cur-1);$("lbX").onclick=()=>show(cur+1);
document.querySelectorAll(".modal").forEach(m=>m.onclick=e=>{if(e.target===m||e.target.hasAttribute("data-close"))m.classList.remove("on")});
addEventListener("keydown",e=>{if(e.key==="Escape")(lb.classList.contains("on")?[lb]:document.querySelectorAll(".modal.on")).forEach(m=>m.classList.remove("on"));if(lb.classList.contains("on")){if(e.key==="ArrowLeft")show(cur-1);if(e.key==="ArrowRight")show(cur+1)}});
$("ctc").onclick=e=>{const b=e.target.closest("[data-copy]");if(!b)return;try{navigator.clipboard.writeText(b.dataset.copy)}catch(x){}const t=b.textContent;b.textContent="¡Copiado!";setTimeout(()=>b.textContent=t,1800)};
/* estadísticas animadas */
function runStats(){const st=$("stats");st.classList.add("go");
 st.querySelectorAll("[data-n]").forEach((el,k)=>{const t=+el.dataset.n,s=el.dataset.s||"",d=1600,t0=performance.now()+k*150;
 (function f(now){const p=Math.min(Math.max((now-t0)/d,0),1),v=1-Math.pow(1-p,3);el.textContent=Math.round(t*v)+s;if(p<1)requestAnimationFrame(f);else{el.classList.add("done");statsDone=true}})(performance.now())})}
if(!PREVIEW)setTimeout(()=>new IntersectionObserver((e,o)=>{if(!e[0].isIntersecting)return;o.disconnect();runStats()},{threshold:.4}).observe($("stats")),(+SITE.loader.ms||2600)+100);
/* barra, menú, loader */
const bar=$("bar");addEventListener("scroll",()=>{const e=document.documentElement;bar.style.width=(e.scrollTop/(e.scrollHeight-e.clientHeight)*100)+"%"},{passive:true});
const L=$("links");$("tg").onclick=()=>L.classList.toggle("open");L.onclick=()=>L.classList.remove("open");
const endLoad=()=>{$("loader").classList.add("off");document.body.classList.remove("lock");scrollTo(0,0)};
if(PREVIEW)endLoad();else{document.querySelector(".lbar i").style.animationDuration=((+SITE.loader.ms||2600)-200)/1000+"s";setTimeout(endLoad,+SITE.loader.ms||2600)}
/* texto que se escribe solo */
{const te=$("typed");let a=0,b=0,del=false;(function t(){const ph=SITE.hero.typed&&SITE.hero.typed.length?SITE.hero.typed:[""];a%=ph.length;const w=ph[a];let n;
if(!del){b=Math.min(b+1,w.length);te.textContent=w.slice(0,b);n=70;if(b>=w.length){del=true;n=1600}}
else{b=Math.min(b,w.length)-1;te.textContent=w.slice(0,Math.max(b,0));n=30;if(b<=0){b=0;del=false;a=(a+1)%ph.length;n=400}}
setTimeout(t,n)})()}
/* vista previa en vivo desde el panel admin */
if(PREVIEW){addEventListener("message",e=>{if(e.data&&e.data.t==="iaimbxt-site"){SITE=e.data.site;render()}if(e.data&&e.data.t==="iaimbxt-bl"){BL=e.data.bl||{};render()}});parent.postMessage({t:"iaimbxt-ready"},"*")}
</script>
</body>
</html>
