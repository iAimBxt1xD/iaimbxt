<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Admin | iAimBxt_</title><link rel="icon" href="img/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#121210;--card:#1a1a17;--line:#2e2e29;--y:#ffd60a;--t:#f2f0e6;--m:#8f8d82}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
.hide{display:none!important}
.btn{font:600 14px Inter;padding:10px 18px;border:2px solid var(--y);border-radius:12px;background:none;color:var(--t);cursor:pointer;box-shadow:3px 3px 0 var(--line);transition:.15s;text-decoration:none;display:inline-block}
.btn.p{background:var(--y);color:#111;box-shadow:3px 3px 0 #6b5a05}.btn:hover{transform:translate(-2px,-2px)}
.btn.s{padding:6px 10px;font-size:13px;box-shadow:none;border-color:var(--line)}.btn.s:hover{border-color:var(--y);transform:none}
.btn.s.on{background:var(--y);color:#111;border-color:var(--y)}.btn.d:hover{border-color:#e5484d;color:#e5484d}
input,textarea,select{width:100%;background:#0c0c0b;border:2px solid var(--line);border-radius:10px;color:var(--t);padding:9px 12px;font:14px Inter;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--y)}
input[type=color]{width:46px;height:40px;padding:2px;flex:none;cursor:pointer}
label{display:block;font:500 11px 'JetBrains Mono';color:var(--m);margin-bottom:4px;text-transform:uppercase}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.box{width:100%;max-width:400px;background:var(--card);border:2px solid var(--y);border-radius:18px;padding:32px;box-shadow:6px 6px 0 var(--y);text-align:center}
.box img{width:72px;height:72px;border-radius:50%;border:3px solid var(--y);margin-bottom:12px}
.box h1{font:800 22px Sora;margin-bottom:4px}.box p{color:var(--m);font-size:14px;margin-bottom:18px}
#msg{font-size:13px;min-height:20px;margin-top:12px;color:#ff6b6b}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 3vw;border-bottom:2px solid var(--line);background:rgba(18,18,16,.97);position:sticky;top:0;z-index:5}
header b{font:800 17px Sora;color:var(--y)}.hb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#st{font:12px 'JetBrains Mono';color:#3ddc84;max-width:46vw}#st.warn{color:#ffd60a}#st.err{color:#ff6b6b}#st.ok{color:#3ddc84}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
.up{flex:none;padding:6px 9px!important}
details textarea.out{margin-top:10px}
.drop{border:2px dashed var(--y);border-radius:16px;padding:26px;text-align:center;margin-bottom:18px;background:rgba(255,214,10,.05);transition:.15s}
.drop.on{background:rgba(255,214,10,.16)}.drop small{display:block;color:var(--m);margin-top:10px;font-size:13px}
.lay{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);height:calc(100vh - 58px)}
.lay.nopv{grid-template-columns:1fr}.lay.nopv .pvw{display:none}
.ed{overflow:auto;padding:16px 3vw 80px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.pvw{border-left:2px solid var(--line);background:#0c0c0b;display:flex;flex-direction:column}
.pvw small{padding:6px 12px;color:var(--m);font:11px 'JetBrains Mono';border-bottom:1px solid var(--line)}
#pv{flex:1;width:100%;border:0;background:#121210}
h2{font:700 22px Sora;margin-bottom:4px}h3{font:700 15px Sora;margin:22px 0 10px;color:var(--y)}.sub{color:var(--m);font-size:14px;margin-bottom:16px}
.row{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:6px}.f .w{grid-column:1/-1}
.tools{display:flex;gap:6px;margin-top:10px;align-items:center}.tools span{margin-left:auto;font:12px 'JetBrains Mono';color:var(--m)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.cl{display:flex;gap:8px}.im2{display:flex;gap:8px;align-items:center}.im2 img{width:40px;height:40px;object-fit:contain;border-radius:8px;background:#0c0c0b;border:1px solid var(--line);flex:none}
.gp{height:46px;border-radius:12px;margin:14px 0;border:2px solid var(--line)}
.pre{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.pre button{display:flex;gap:8px;align-items:center}.pre i{display:inline-block;width:36px;height:12px;border-radius:6px}
.tip{background:rgba(255,214,10,.08);border:1px solid rgba(255,214,10,.3);border-radius:12px;padding:12px 14px;font-size:13.5px;color:#d4d2c6;margin-bottom:18px}
textarea.out{height:260px;font:12px 'JetBrains Mono';color:var(--y)}
ol{margin:10px 0 18px 20px;line-height:1.9;font-size:14.5px}
@media(max-width:900px){.lay{grid-template-columns:1fr;height:auto}.pvw{height:70vh;border-left:0;border-top:2px solid var(--line)}}
</style></head><body>
<div id="login"><div class="box"><img src="img/logo.png" alt="" onerror="this.style.display='none'">
<h1>Admin Panel</h1><p>Acceso restringido. Ingresa la contraseña.</p>
<input type="password" id="pw" placeholder="Contraseña" autocomplete="current-password">
<button class="btn p" id="go" style="width:100%;margin-top:14px">Entrar</button><div id="msg"></div>
<a href="index.html" style="display:inline-block;margin-top:10px;color:var(--m);font-size:13px">← Volver al portafolio</a></div></div>

<div id="app" class="hide">
<header><b>iAimBxt_ · Admin</b>
<div class="hb"><span id="st"></span><button class="btn s on" id="tpv">Vista previa</button><button class="btn p" id="pub">🚀 Actualizar página</button><a class="btn s" href="index.html">Ver sitio</a><button class="btn s d" id="out">Salir</button></div></header>
<div class="lay" id="lay"><div class="ed"><div class="tabs" id="tabs"></div><div id="panel"></div></div>
<div class="pvw"><small>VISTA PREVIA EN VIVO — lo que cambies se ve aquí al instante</small><input type="file" id="fi" class="hide" accept="image/png,image/jpeg,image/webp,image/gif"><input type="file" id="fw" class="hide" multiple accept="image/png,image/jpeg,image/webp,image/gif"><input type="file" id="fj" class="hide" accept=".jar"><iframe id="pv" src="index.html?preview=1" title="Vista previa"></iframe></div></div></div>

<script src="data.js"></script>
<script>
if(!window.SITE)document.body.innerHTML='<p style="padding:40px;font-family:sans-serif;color:#fff">No se encontró data.js. Ponlo en la misma carpeta que admin.html.</p>';
const $=id=>document.getElementById(id),clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ORIG=clone(window.SITE||{});
const fill=(d,o)=>{for(const k in o){if(d[k]==null)d[k]=clone(o[k]);else if(o[k]&&typeof o[k]==="object"&&!Array.isArray(o[k]))fill(d[k],o[k])}return d};
let D;try{D=JSON.parse(localStorage.iaimbxt_site)}catch(e){}
D=fill(D&&D.hero?D:clone(ORIG),ORIG);
let PUB=JSON.stringify(ORIG);try{if(localStorage.iaimbxt_pub)PUB=localStorage.iaimbxt_pub}catch(e){}
const getp=(o,p)=>p.split(".").reduce((a,k)=>a==null?a:a[k],o);
const setp=(o,p,v)=>{const k=p.split("."),l=k.pop();k.reduce((a,x)=>a[x],o)[l]=v};
const BL={};
const BLANK={plugins:["","",""],servers:["","Developer","","resign"],skills:["","",""],reviews:["","","Dueño","",""],works:["trabajos/","",""],contact:["","","","Abrir",""],stats:[0,"",""]};
const PRESETS=[["Amarillo","#ffd60a","#ffe98a","#ff9f1c"],["Morado","#a78bfa","#e9d5ff","#ec4899"],["Verde","#3ddc84","#bbf7d0","#06b6d4"],["Azul","#38bdf8","#e0f2fe","#6366f1"],["Rosa","#ff5fa2","#ffd1e6","#ff9f1c"],["Rojo","#ff4d4d","#ffd0d0","#ff9f1c"]];
/* ---------- login (se valida en el servidor) ---------- */
const TK=()=>sessionStorage.iaimbxt_tk;
function enter(){$("login").classList.add("hide");$("app").classList.remove("hide");try{localStorage.iaimbxt_admin="1"}catch(e){}draw();dirtySt()}
function logout(){sessionStorage.removeItem("iaimbxt_tk");location.reload()}
async function login(){
 if(Date.now()<(+sessionStorage.lk||0)){$("msg").textContent="Demasiados intentos. Espera un momento.";return}
 let r,j={};
 try{r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("pw").value})});j=await r.json()}
 catch(e){$("msg").textContent="No se pudo conectar. Abre el admin desde tu dominio de Vercel (en local no existe /api).";return}
 if(r.ok&&j.token){sessionStorage.fails=0;sessionStorage.iaimbxt_tk=j.token;enter()}
 else{$("msg").textContent=j.error||"Error al entrar.";if(r.status===401){const f=(+sessionStorage.fails||0)+1;sessionStorage.fails=f;if(f>=5){sessionStorage.lk=Date.now()+60000;sessionStorage.fails=0}}$("pw").value=""}}
$("go").onclick=login;$("pw").onkeydown=e=>{if(e.key==="Enter")login()};
$("out").onclick=logout;
/* ---------- constructores de formulario ---------- */
const F=(label,p,o={})=>{const v=getp(D,p),a=`data-p="${p}"`;let i;
 if(o.k==="area")i=`<textarea rows="${o.r||3}" ${a}>${esc(v)}</textarea>`;
 else if(o.k==="lines")i=`<textarea rows="4" ${a} data-k="lines">${esc((v||[]).join("\n"))}</textarea>`;
 else if(o.k==="num")i=`<input type="number" ${a} data-k="num" value="${esc(v)}">`;
 else if(o.k==="color")i=`<div class="cl"><input type="color" ${a} data-k="color" value="${esc(v)}"><input ${a} data-k="color" value="${esc(v)}"></div>`;
 else if(o.k==="sel")i=`<select ${a}>${o.o.map(([x,y])=>`<option value="${x}" ${x===v?"selected":""}>${y}</option>`).join("")}</select>`;
 else if(o.k==="jar")i=`<div class="im2"><input ${a} data-k="jar" placeholder="plugins/MiPlugin.jar" value="${esc(v)}"><button type="button" class="btn s up" data-a="upjar" data-p="${p}" style="white-space:nowrap">⬆ Subir .jar</button></div>`;
 else if(o.k==="img")i=`<div class="im2"><img data-th="${p}" src="${esc(BL[v]||(o.pre||"")+v)}" alt="" onerror="this.style.opacity=.2"><input ${a} data-k="img" data-pre="${o.pre||""}" value="${esc(v)}"><button type="button" class="btn s up" data-a="upimg" data-p="${p}" title="Subir imagen">⬆</button></div>`;
 else i=`<input ${a} value="${esc(v)}">`;
 return `<div class="${o.w?"w":""}"><label>${label}</label>${i}</div>`};
const grid=x=>`<div class="f">${x}</div>`;
const LST=(path,cols)=>getp(D,path).map((r,i)=>`<div class="row">${grid(cols.map(([l,j,o])=>F(l,`${path}.${i}.${j}`,o)).join(""))}<div class="tools"><button class="btn s" data-a="up" data-l="${path}" data-i="${i}">↑</button><button class="btn s" data-a="dn" data-l="${path}" data-i="${i}">↓</button><button class="btn s d" data-a="del" data-l="${path}" data-i="${i}">Eliminar</button><span>#${i+1}</span></div></div>`).join("")+`<div class="bar"><button class="btn p" data-a="add" data-l="${path}">+ Agregar</button></div>`;
const TITLE=(t,s)=>`<h2>${t}</h2><p class="sub">${s}</p>`;
const SEC=k=>grid(F("Etiqueta pequeña",`sec.${k}.0`)+F("Título",`sec.${k}.1`)+F("Descripción",`sec.${k}.2`));
const TABS={
general:["General",()=>TITLE("General","Textos principales, logo, pantalla de bienvenida y enlaces.")+grid(
 F("Título de la pestaña",`title`,{w:1})+F("Nombre / marca","brand")+F("Logo (ruta)","logo",{k:"img"})+F("Foto del hero (ruta)","hero.photo",{k:"img"})+
 F("Bienvenida: subtítulo","loader.role")+F("Bienvenida: texto","loader.welcome")+F("Bienvenida: duración (ms)","loader.ms",{k:"num"})+
 F("Sticker flotante (vacío = ocultar)","hero.sticker")+F("Saludo","hero.hi")+F("Nombre grande","hero.name")+
 F("Frases que se escriben (una por línea)","hero.typed",{k:"lines",w:1})+F("Descripción","hero.desc",{k:"area",w:1})+
 F("Botón 1","hero.btn1")+F("Botón 2","hero.btn2")+F("Link Discord","links.discord")+F("Link NameMC","links.namemc")+F("Pie de página","footer",{w:1}))+
 `<h3>Estadísticas (números animados)</h3>`+LST("stats",[["Número",0,{k:"num"}],["Sufijo (ej: %)",1],["Texto",2]])],
colors:["Colores",()=>{const T=D.theme;return TITLE("Colores y degradados","Los cambios se ven al instante en la vista previa.")+
 `<h3>Estilos rápidos</h3><div class="pre">${PRESETS.map((p,i)=>`<button class="btn s" data-a="preset" data-i="${i}"><i style="background:linear-gradient(90deg,${p[2]},${p[1]},${p[3]})"></i>${p[0]}</button>`).join("")}</div>
 <div class="gp" id="gp" style="background:linear-gradient(90deg,${T.g1},${T.accent},${T.g2})"></div>`+grid(
 F("Color principal (acento)","theme.accent",{k:"color"})+F("Degradado: inicio (claro)","theme.g1",{k:"color"})+F("Degradado: final","theme.g2",{k:"color"})+
 F("Fondo","theme.bg",{k:"color"})+F("Tarjetas","theme.card",{k:"color"})+F("Bordes / líneas","theme.line",{k:"color"})+
 F("Texto","theme.text",{k:"color"})+F("Texto secundario","theme.muted",{k:"color"}))}],
secs:["Secciones",()=>TITLE("Secciones","Títulos de cada sección y velocidad de la lista de servidores.")+
 ["plugins","servers","skills","reviews","works","contact"].map(k=>`<h3>${k}</h3>`+SEC(k)).join("")+`<h3>Lista de servidores</h3>`+grid(F("Segundos por vuelta (más alto = más lento)","speed",{k:"num"}))],
plugins:["Plugins",()=>TITLE("Plugins","Los que hiciste tú. Sube el .jar y quien haga clic en la caja del plugin lo descarga.")+LST("plugins",[["Nombre",0],["Descripción",1],["Archivo .jar (opcional)",2,{k:"jar",w:1}]])],
servers:["Servidores",()=>TITLE("Servidores","Estado ACTUAL (verde) o RESIGN (rojo). La imagen es el nombre del archivo dentro de img/.")+LST("servers",[["Nombre",0],["Rango",1],["Imagen (archivo en img/)",2,{k:"img",pre:"img/"}],["Estado",3,{k:"sel",o:[["resign","RESIGN (ya no estoy)"],["actual","ACTUAL (sigo en el server)"]]}]])],
skills:["Habilidades",()=>TITLE("Habilidades","Las etiquetas van separadas por coma.")+LST("skills",[["Título",0],["Descripción",1],["Etiquetas (separadas por coma)",2,{w:1}]])],
reviews:["Reseñas",()=>TITLE("Reseñas","Lo que dicen los dueños.")+LST("reviews",[["Servidor",0],["Autor",1],["Rango",2],["Imagen (archivo en img/)",3,{k:"img",pre:"img/"}],["Texto",4,{k:"area",w:1}]])],
works:["Trabajos",()=>TITLE("Trabajos","Sube todas las capturas que quieras y luego solo escribe nombre y descripción.")+`<div class="drop" id="drop"><b>Arrastra tus imágenes aquí</b><br><br><button class="btn p" data-a="pickworks">Elegir imágenes</button><small>Puedes elegir muchas a la vez; se optimizan solas. En el portafolio salen las 3 primeras y el resto en «Ver más». Al terminar pulsa 🚀 Actualizar página.</small></div>`+LST("works",[["Imagen (ruta)",0,{k:"img"}],["Nombre",1],["Descripción (se ve al abrir la foto)",2,{w:1}]])],
contact:["Contacto",()=>TITLE("Contacto","Si dejas el link vacío, el botón copia el texto de arriba (ej. tu usuario de Discord).")+LST("contact",[["Título",0],["Subtítulo",1],["Texto / usuario",2],["Texto del botón",3],["Link (vacío = copiar)",4,{w:1}]])],
pub:["Publicar",()=>TITLE("Publicar cambios","Pulsa el botón y tu portafolio real se actualiza solo.")+
 `<div class="tip">Al pulsar <b>🚀 Actualizar página</b> tus cambios se guardan en GitHub y Vercel vuelve a publicar el sitio (tarda ~30–60 s). Arriba te avisa cuando ya esté en vivo.</div>
 <div class="bar"><button class="btn p" data-a="publish">🚀 Actualizar página</button><button class="btn s d" data-a="reset">Descartar cambios y volver al original</button></div>
 <details style="margin-top:18px"><summary style="cursor:pointer;color:var(--m);font-size:13px">Método manual (copia de seguridad)</summary><textarea class="out" readonly>${esc(dataJs())}</textarea><div class="bar"><button class="btn s" data-a="dl">⬇ Descargar data.js</button><button class="btn s" data-a="cp">Copiar data.js</button></div></details>`]};
let tab="general";
const dataJs=()=>"window.SITE="+JSON.stringify(D,null,1)+";\n";
function draw(){$("tabs").innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="btn s ${k===tab?"on":""}" data-t="${k}">${v[0]}</button>`).join("");$("panel").innerHTML=TABS[tab][1]()}
/* ---------- guardado y vista previa ---------- */
const setSt=(t,c)=>{const e=$("st");e.textContent=t;e.className=c||""};
let busy=false;
function dirtySt(){if(busy)return;JSON.stringify(D)===PUB?setSt("✓ al día con la página","ok"):setSt("● cambios sin publicar","warn")}
let tm;function changed(){try{localStorage.iaimbxt_site=JSON.stringify(D)}catch(e){}dirtySt();clearTimeout(tm);tm=setTimeout(post,120);
 const g=$("gp");if(g)g.style.background=`linear-gradient(90deg,${D.theme.g1},${D.theme.accent},${D.theme.g2})`}
const postBL=()=>{try{$("pv").contentWindow.postMessage({t:"iaimbxt-bl",bl:BL},"*")}catch(e){}};
const post=()=>{try{$("pv").contentWindow.postMessage({t:"iaimbxt-site",site:D},"*")}catch(e){}};
addEventListener("message",e=>{if(e.data&&e.data.t==="iaimbxt-ready"){post();postBL()}});
$("pv").onload=post;
$("panel").addEventListener("input",e=>{const t=e.target,p=t.dataset.p;if(!p)return;let v=t.value;
 if(t.dataset.k==="num")v=Number(v)||0;
 if(t.dataset.k==="lines")v=v.split("\n").map(x=>x.trim()).filter(Boolean);
 setp(D,p,v);
 if(t.dataset.k==="color"&&/^#[0-9a-f]{6}$/i.test(v))document.querySelectorAll(`[data-p="${p}"]`).forEach(x=>{if(x!==t)x.value=v});
 if(t.dataset.k==="img")document.querySelectorAll(`[data-th="${p}"]`).forEach(x=>{x.style.opacity=1;x.src=t.dataset.pre+v});
 changed()});
$("tabs").onclick=e=>{const k=e.target.dataset.t;if(k){tab=k;draw()}};
$("panel").onclick=e=>{const a=e.target.dataset.a;if(!a)return;if(a==="publish"){pub();return}
 if(a==="dl"){download();return}
 if(a==="cp"){try{navigator.clipboard.writeText(dataJs())}catch(x){}e.target.textContent="¡Copiado!";return}
 if(a==="upimg"){UPP=e.target.dataset.p;$("fi").value="";$("fi").click();return}
 if(a==="upjar"){UPP=e.target.dataset.p;$("fj").value="";$("fj").click();return}
 if(a==="pickworks"){$("fw").value="";$("fw").click();return}
 const i=+e.target.dataset.i,l=e.target.dataset.l,L=l?getp(D,l):null;
 if(a==="add"){L.push(clone(BLANK[l]));changed();draw();$("panel").parentNode.scrollTo(0,1e6);return}
 if(a==="del"){if(!confirm("¿Eliminar este elemento?"))return;L.splice(i,1)}
 else if(a==="up"&&i>0)[L[i-1],L[i]]=[L[i],L[i-1]];
 else if(a==="dn"&&i<L.length-1)[L[i+1],L[i]]=[L[i],L[i+1]];
 else if(a==="preset"){const p=PRESETS[i];D.theme.accent=p[1];D.theme.g1=p[2];D.theme.g2=p[3]}
 else if(a==="reset"){if(!confirm("¿Descartar todos tus cambios?"))return;localStorage.removeItem("iaimbxt_site");localStorage.removeItem("iaimbxt_pub");location.reload();return}
 changed();draw()};
$("tpv").onclick=function(){this.classList.toggle("on");$("lay").classList.toggle("nopv")};
function download(){const u=URL.createObjectURL(new Blob([dataJs()],{type:"text/javascript"})),a=document.createElement("a");a.href=u;a.download="data.js";a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const authHdr=()=>({"Content-Type":"application/json",Authorization:"Bearer "+TK()});
async function call(url,body){
 const r=await fetch(url,{method:"POST",headers:authHdr(),body:JSON.stringify(body)});
 const j=await r.json().catch(()=>({}));
 if(r.status===401){alert(j.error||"Sesión vencida.");logout();throw new Error("Sesión vencida")}
 if(!r.ok)throw new Error(j.error||"Error "+r.status);
 return j}
/* ---------- botón ACTUALIZAR PÁGINA ---------- */
async function pub(){
 if(busy)return;busy=true;
 const btns=[$("pub"),...document.querySelectorAll('[data-a="publish"]')],expected=dataJs(),snap=JSON.stringify(D);
 btns.forEach(b=>{b.disabled=true;b.dataset.t=b.textContent;b.textContent="Publicando…"});
 setSt("⏳ Enviando cambios…","warn");
 try{
  const j=await call("/api/publish",{site:clone(D)});
  PUB=snap;try{localStorage.iaimbxt_pub=PUB}catch(e){}
  if(j.unchanged){setSt("✓ La página ya estaba así de actualizada","ok")}
  else{setSt("⏳ Enviado. Esperando que Vercel publique…","warn");await waitLive(expected)}
 }catch(e){setSt("✕ "+e.message,"err")}
 finally{busy=false;btns.forEach(b=>{b.disabled=false;b.textContent=b.dataset.t})}}
async function waitLive(expected){
 for(let i=0;i<40;i++){await sleep(5000);
  try{const t=await(await fetch("data.js?t="+Date.now(),{cache:"no-store"})).text();if(t.replace(/\r/g,"")===expected){setSt("✓ ¡Listo! Ya está en vivo","ok");return}}catch(e){}}
 setSt("Enviado, pero Vercel tarda más de lo normal. Revisa el deploy en tu panel de Vercel.","warn")}
$("pub").onclick=pub;
/* ---------- subir imágenes a img/ ---------- */
let UPP=null;
const toB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error("No se pudo leer el archivo"));r.readAsDataURL(b)});
async function prep(file){
 const m=file.name.match(/\.(png|jpe?g|webp|gif)$/i);if(!m)throw new Error("Usa una imagen png, jpg, webp o gif.");
 let e=m[1].toLowerCase().replace("jpeg","jpg"),blob=file;
 const name=file.name.replace(/\.[^.]+$/,"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9_-]+/g,"-").replace(/^-+|-+$/g,"")||"imagen";
 const enc=(c,mime,q)=>new Promise(r=>c.toBlob(r,mime,q));
 if(file.size>1.5*1024*1024&&e!=="gif"){
  const bm=await createImageBitmap(file),k=Math.min(1,1600/Math.max(bm.width,bm.height)),c=document.createElement("canvas");
  c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
  const mime=e==="jpg"?"image/jpeg":e==="webp"?"image/webp":"image/png";
  blob=await enc(c,mime,.9);
  if(blob.size>3*1024*1024){blob=await enc(c,"image/webp",.85);e="webp"}}
 if(blob.size>3*1024*1024)throw new Error("La imagen pesa más de 3 MB. Redúcela e inténtalo de nuevo.");
 return{name:name+"."+e,blob}}
$("fi").onchange=async function(){
 const f=this.files[0],p=UPP;if(!f||!p)return;
 setSt("⏳ Subiendo imagen…","warn");busy=true;
 try{
  const{name,blob}=await prep(f),url=await toB64(blob);
  await call("/api/upload",{name,data:url.split(",")[1]});
  const inp=document.querySelector(`input[data-k="img"][data-p="${p}"]`),pre=inp.dataset.pre;
  inp.value=pre?name:"img/"+name;inp.dispatchEvent(new Event("input",{bubbles:true}));
  document.querySelectorAll(`[data-th="${p}"]`).forEach(x=>{x.style.opacity=1;x.src=url});
  busy=false;setSt("✓ Imagen subida ("+name+"). Pulsa Actualizar página para usarla.","ok")}
 catch(e){busy=false;setSt("✕ "+e.message,"err")}
 finally{busy=false}};
/* ---------- subir MUCHOS trabajos a la vez ---------- */
const encC=(c,m,q)=>new Promise(r=>c.toBlob(r,m,q));
async function prepWork(file,i){
 const base=file.name.replace(/\.[^.]+$/,"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40)||"trabajo";
 const bm=await createImageBitmap(file),k=Math.min(1,1920/Math.max(bm.width,bm.height)),c=document.createElement("canvas");
 c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
 let ext="webp",blob=await encC(c,"image/webp",.86);
 if(!blob||blob.type!=="image/webp"){ext="jpg";blob=await encC(c,"image/jpeg",.86)}
 if(blob.size>3*1024*1024)blob=await encC(c,ext==="webp"?"image/webp":"image/jpeg",.65);
 if(blob.size>3*1024*1024)throw new Error(file.name+" pesa demasiado");
 return{name:base+"-"+Date.now().toString(36)+i+"."+ext,url:await toB64(blob)}}
async function uploadWorks(files){
 files=[...files].filter(f=>/^image\//.test(f.type)||/\.(png|jpe?g|webp|gif)$/i.test(f.name));
 if(!files.length||busy)return;busy=true;let ok=0,bad=0;
 for(let i=0;i<files.length;i++){
  setSt(`⏳ Subiendo imagen ${i+1} de ${files.length}…`,"warn");
  try{
   const{name,url}=await prepWork(files[i],i);
   await call("/api/upload",{kind:"work",name,data:url.split(",")[1]});
   const path="trabajos/"+name;BL[path]=url;
   D.works.push([path,files[i].name.replace(/\.[^.]+$/,"").replace(/[_-]+/g," ").trim(),""]);ok++;
   try{localStorage.iaimbxt_site=JSON.stringify(D)}catch(e){}
  }catch(e){bad++;if(/Sesión/.test(e.message))break}}
 busy=false;changed();postBL();if(tab==="works")draw();
 setSt(`✓ ${ok} imagen(es) subida(s)${bad?` · ✕ ${bad} fallaron`:""}. Escribe nombre y descripción y pulsa Actualizar página.`,bad?"warn":"ok")}
{const pn=$("panel"),dz=e=>e.target.closest&&e.target.closest("#drop");
 pn.addEventListener("dragover",e=>{const d=dz(e);if(d){e.preventDefault();d.classList.add("on")}});
 pn.addEventListener("dragleave",e=>{const d=dz(e);if(d)d.classList.remove("on")});
 pn.addEventListener("drop",e=>{const d=dz(e);if(!d)return;e.preventDefault();d.classList.remove("on");uploadWorks(e.dataTransfer.files)})}
$("fw").onchange=function(){uploadWorks(this.files)};

$("fj").onchange=async function(){
